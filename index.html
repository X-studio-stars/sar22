<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon Stream - المنصة الاحترافية</title>
    <style>
        :root {
            --bg-dark: #070708;
            --card-bg: #121214;
            --accent-red: #990000;
            --accent-hover: #cc0000;
            --text-main: #ffffff;
            --text-secondary: #9aa0a6;
            --glow: rgba(153, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* شريط التنقل */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: linear-gradient(to bottom, rgba(7,7,8,0.95), rgba(7,7,8,0));
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: 0.4s;
        }

        header.scrolled {
            background: #070708;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--glow);
        }

        .search-bar {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            width: 250px;
            transition: 0.3s;
            outline: none;
        }

        .search-bar:focus {
            width: 320px;
            border-color: var(--accent-red);
            box-shadow: 0 0 10px var(--glow);
        }

        /* الواجهة الرئيسية المميزة */
        .hero {
            height: 85vh;
            background: linear-gradient(to top, var(--bg-dark) 5%, rgba(7,7,8,0.3) 60%), 
                        linear-gradient(to right, rgba(7,7,8,0.9) 30%, rgba(7,7,8,0.1)), 
                        url('https://image.tmdb.org/t/p/original/nYZSNyqYqXhL1H2R01yofXvW1u3.jpg') center/cover;
            display: flex;
            align-items: center;
            padding: 0 5%;
            margin-bottom: 20px;
        }

        .hero-content {
            max-width: 650px;
            animation: fadeInUp 1s ease;
        }

        .hero-title {
            font-size: 55px;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .hero-desc {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-main {
            background-color: var(--accent-red);
            color: white;
            box-shadow: 0 5px 15px var(--glow);
        }

        .btn-main:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* شبكة عرض المسلسلات */
        .container {
            padding: 0 5% 60px 5%;
        }

        .section-header {
            font-size: 22px;
            margin: 40px 0 20px 0;
            position: relative;
            padding-right: 15px;
        }

        .section-header::before {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 4px;
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s;
            position: relative;
        }

        .card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 10px rgba(153,0,0,0.2);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info {
            padding: 12px;
            background: linear-gradient(to top, #121214 80%, rgba(18,18,20,0));
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 12px;
            color: var(--accent-red);
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }

        /* مشغل الفيديو والنافذة المنبثقة (Modal) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 6, 0.95);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #0f0f11;
            width: 90%;
            max-width: 900px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            animation: scaleUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            font-size: 20px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s;
        }

        .close-modal:hover {
            background: var(--accent-red);
        }

        .video-container {
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
        }

        .video-container video {
            width: 100%;
            height: 100%;
        }

        .modal-details {
            padding: 25px;
        }

        .player-controls-area {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
        }

        select {
            background: #1c1c1f;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-red);
        }

        /* أنميشن */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header id="mainHeader">
        <div class="logo">Demon Stream</div>
        <input type="text" class="search-bar" id="searchShow" placeholder="ابحث عن مسلسلك المفضل...">
    </header>

    <!-- الهيرو -->
    <section class="hero" id="heroSection">
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">The Boys</h1>
            <p class="hero-desc" id="heroDesc">عندما يستغل الأبطال الخارقون قواهم لأغراض شريرة، تنطلق مجموعة من الحراس السريين في مهمة ملحمية لكشف الحقيقة وإسقاطهم دون أي قيود.</p>
            <button class="btn btn-main" onclick="openPlayer(0)">شاهد الآن مجاناً</button>
        </div>
    </section>

    <!-- المحتوى والشبكة -->
    <div class="container">
        <h2 class="section-header">المسلسلات المتوفرة بالكامل</h2>
        <div class="grid" id="showsGrid">
            <!-- سيتم توليد الكروت تلقائياً عبر الجافاسكربت -->
        </div>
    </div>

    <!-- نافذة مشغل الفيديو الاحترافي -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePlayer()">&times;</button>
            <div class="video-container">
                <!-- مشغل فيديو احترافي يدعم الترجمة والمشاهدة بجودة عالية -->
                <video id="mainVideo" controls poster="">
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    <!-- مسارات الترجمة التلقائية عربية وانجليزية -->
                    <track src="#" kind="subtitles" srclang="ar" label="العربية" default>
                    <track src="#" kind="subtitles" srclang="en" label="English">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>
            <div class="modal-details">
                <h2 id="modalShowTitle">اسم المسلسل</h2>
                <p id="modalShowDesc" style="color: var(--text-secondary); margin-top: 8px; font-size: 14px;"></p>
                
                <div class="player-controls-area">
                    <label>اختر الموسم:</label>
                    <select id="seasonSelect" onchange="updateEpisodes()">
                        <!-- مواسم ديناميكية -->
                    </select>

                    <label>اختر الحلقة:</label>
                    <select id="episodeSelect" onchange="playEpisode()">
                        <!-- حلقات ديناميكية -->
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- كود التشغيل الذكي والبيانات -->
    <script>
        // قاعدة بيانات المحاكاة للمسلسلات الشهيرة كاملة الحلقات
        const showsDatabase = [
            {
                id: 0,
                title: "The Boys",
                desc: "مجموعة من الحراس يسعون للإطاحة بالأبطال الخارقين الفاسدين الذين يسيئون استخدام قواهم.",
                img: "https://image.tmdb.org/t/p/w500/nYZSNyqYqXhL1H2R01yofXvW1u3.jpg",
                seasons: 4,
                episodesPerSeason: 8,
                quality: "4K UHD"
            },
            {
                id: 1,
                title: "The Mentalist",
                desc: "باتريك جين، وسيط روحي سابق يعمل كمستشار لمكتب التحقيقات لحل الجرائم باستخدام مهارات الملاحظة الحادة.",
                img: "https://image.tmdb.org/t/p/w500/7yO4QAUyOPFqE0uWd2L4QkEt531.jpg",
                seasons: 7,
                episodesPerSeason: 22,
                quality: "1080p HD"
            },
            {
                id: 2,
                title: "Breaking Bad",
                desc: "معلم كيمياء في المدرسة الثانوية يصاب بسرطان الرئة فيتحول إلى عالم الجريمة لضمان مستقبل عائلته المالي.",
                img: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizwpkE.jpg",
                seasons: 5,
                episodesPerSeason: 13,
                quality: "1080p HD"
            },
            {
                id: 3,
                title: "Peaky Blinders",
                desc: "عصابة إنكليزية شهيرة في برمنغهام يقودها تومي شيلبي الخطير والطموح بعد الحرب العالمية الأولى.",
                img: "https://image.tmdb.org/t/p/w500/1k1qht5XmIfYk20Pge9hK7Q4uXo.jpg",
                seasons: 6,
                episodesPerSeason: 6,
                quality: "4K Ultra"
            }
        ];

        const grid = document.getElementById('showsGrid');
        const searchInput = document.getElementById('searchShow');

        // دالة لعرض المسلسلات في الشبكة
        function renderShows(database) {
            grid.innerHTML = "";
            database.forEach(show => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(show.id);
                card.innerHTML = `
                    <img src="${show.img}" alt="${show.title}">
                    <div class="card-info">
                        <div class="card-title">${show.title}</div>
                        <div class="card-meta">
                            <span>المواسم: ${show.seasons}</span>
                            <span>${show.quality}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تشغيل البحث الفوري والذكي
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = showsDatabase.filter(show => show.title.toLowerCase().includes(term));
            renderShows(filtered);
        });

        // تأثير قناع الهيدر عند النزول
        window.addEventListener('scroll', () => {
            const header = document.getElementById('mainHeader');
            if(window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });

        let currentShow = null;

        // فتح مشغل الفيديو وتجهيز البيانات
        function openPlayer(id) {
            currentShow = showsDatabase.find(s => s.id === id);
            if(!currentShow) return;

            document.getElementById('modalShowTitle').innerText = currentShow.title;
            document.getElementById('modalShowDesc').innerText = currentShow.desc;
            
            // تعبئة قائمة المواسم
            const seasonSelect = document.getElementById('seasonSelect');
            seasonSelect.innerHTML = "";
            for(let i = 1; i <= currentShow.seasons; i++) {
                seasonSelect.innerHTML += `<option value="${i}">الموسم ${i}</option>`;
            }

            updateEpisodes();

            const modal = document.getElementById('videoModal');
            modal.classList.add('active');
            document.getElementById('mainVideo').play();
        }

        // تحديث الحلقات بناءً على الموسم المختار
        function updateEpisodes() {
            const epSelect = document.getElementById('episodeSelect');
            epSelect.innerHTML = "";
            for(let i = 1; i <= currentShow.episodesPerSeason; i++) {
                epSelect.innerHTML += `<option value="${i}">الحلقة ${i}</option>`;
            }
        }

        // محاكاة تشغيل الحلقة المختارة بدون تقطيع
        function playEpisode() {
            const s = document.getElementById('seasonSelect').value;
            const e = document.getElementById('episodeSelect').value;
            const video = document.getElementById('mainVideo');
            
            // هنا نقوم بإعادة تحميل الفيديو لمحاكاة الانتقال الفوري بين الحلقات
            video.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"; 
            video.play();
        }

        // إغلاق المشغل
        function closePlayer() {
            const modal = document.getElementById('videoModal');
            document.getElementById('mainVideo').pause();
            modal.classList.remove('active');
        }

        // التثبيت الأولي للموقع عند الفتح
        renderShows(showsDatabase);
    </script>
</body>
</html>
