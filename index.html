<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Demon Stream</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>

<style>
:root{
--bg:#090909;
--card:#151515;
--red:#b30000;
--red2:#ff1a1a;
--text:#fff;
--gray:#b5b5b5;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
scroll-behavior:smooth;
}

body{
background:var(--bg);
color:white;
overflow-x:hidden;
}

/* HEADER */

header{
position:fixed;
top:0;
width:100%;
z-index:1000;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(to bottom,#000,transparent);
transition:.3s;
}

header.active{
background:#0b0b0b;
backdrop-filter:blur(10px);
}

.logo{
font-size:32px;
font-weight:900;
color:var(--red2);
text-shadow:0 0 20px rgba(255,0,0,.5);
}

.search{
width:280px;
padding:12px 18px;
border-radius:40px;
border:none;
outline:none;
background:#1b1b1b;
color:white;
transition:.3s;
}

.search:focus{
width:350px;
box-shadow:0 0 20px rgba(255,0,0,.4);
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(to top,#090909 10%,transparent 70%),
linear-gradient(to right,#000 20%,transparent 70%),
url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070&auto=format&fit=crop') center/cover;
display:flex;
align-items:center;
padding:0 5%;
}

.hero-content{
max-width:650px;
animation:fade 1s ease;
}

.hero h1{
font-size:70px;
margin-bottom:20px;
}

.hero p{
color:#ccc;
line-height:1.8;
font-size:18px;
margin-bottom:25px;
}

.hero-buttons{
display:flex;
gap:15px;
}

.btn{
padding:14px 35px;
border:none;
border-radius:8px;
font-weight:bold;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.btn-red{
background:var(--red);
color:white;
}

.btn-red:hover{
background:var(--red2);
transform:translateY(-2px);
}

.btn-dark{
background:#222;
color:white;
}

.btn-dark:hover{
background:#333;
}

/* SECTION */

.section{
padding:40px 5%;
}

.section-title{
font-size:28px;
margin-bottom:25px;
position:relative;
padding-right:15px;
}

.section-title::before{
content:'';
position:absolute;
right:0;
top:10%;
height:80%;
width:4px;
background:red;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:25px;
}

.card{
background:var(--card);
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.4s;
position:relative;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 25px rgba(255,0,0,.25);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.card-info{
padding:15px;
}

.card-title{
font-size:17px;
font-weight:bold;
margin-bottom:8px;
}

.card-meta{
display:flex;
justify-content:space-between;
color:#999;
font-size:13px;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
justify-content:center;
align-items:center;
z-index:5000;
padding:30px;
}

.modal.active{
display:flex;
animation:fade .3s ease;
}

.modal-content{
background:#101010;
width:100%;
max-width:1100px;
border-radius:15px;
overflow:hidden;
position:relative;
}

.close{
position:absolute;
left:15px;
top:15px;
width:40px;
height:40px;
border:none;
border-radius:50%;
background:#1d1d1d;
color:white;
font-size:20px;
cursor:pointer;
z-index:10;
}

.video-box{
width:100%;
background:black;
}

.modal-info{
padding:25px;
}

.modal-title{
font-size:35px;
margin-bottom:10px;
}

.modal-desc{
color:#bbb;
line-height:1.7;
margin-bottom:20px;
}

.controls{
display:flex;
gap:15px;
flex-wrap:wrap;
}

select{
padding:10px 15px;
background:#1b1b1b;
border:none;
border-radius:8px;
color:white;
font-size:15px;
outline:none;
}

/* FOOTER */

footer{
padding:30px;
text-align:center;
color:#888;
border-top:1px solid #222;
margin-top:50px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:700px){

.hero h1{
font-size:45px;
}

.search{
width:180px;
}

.search:focus{
width:220px;
}

.card img{
height:270px;
}

}
</style>
</head>
<body>

<header id="header">
<div class="logo">DEMON STREAM</div>
<input type="text" class="search" id="searchInput" placeholder="ابحث عن مسلسل...">
</header>

<section class="hero">
<div class="hero-content">
<h1>Breaking Bad</h1>

<p>
منصة مشاهدة احترافية بتصميم سينمائي فاخر،
واجهة قوية وسريعة مع تشغيل حلقات ومواسم بالكامل.
</p>

<div class="hero-buttons">
<button class="btn btn-red" onclick="openPlayer(0)">
شاهد الآن
</button>

<button class="btn btn-dark">
أضف للمفضلة
</button>
</div>
</div>
</section>

<section class="section">

<h2 class="section-title">
المسلسلات
</h2>

<div class="grid" id="grid"></div>

</section>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<button class="close" onclick="closePlayer()">
×
</button>

<div class="video-box">

<video id="player" playsinline controls>
<source src="" type="video/mp4">
</video>

</div>

<div class="modal-info">

<h1 class="modal-title" id="modalTitle"></h1>

<p class="modal-desc" id="modalDesc"></p>

<div class="controls">

<select id="seasonSelect"></select>

<select id="episodeSelect"></select>

</div>

</div>

</div>

</div>

<footer>
Demon Stream © 2026
</footer>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>

const player = new Plyr('#player');

const shows = [

{
id:0,
title:"Breaking Bad",
description:"مدرس كيمياء يتحول إلى أخطر صانع مخدرات.",
image:"https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizwpkE.jpg",
quality:"1080p",
year:"2008",
seasons:[
{
season:1,
episodes:[
{
title:"الحلقة 1",
video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
},
{
title:"الحلقة 2",
video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
}
]
}
]
},

{
id:1,
title:"Peaky Blinders",
description:"عائلة شيلبي الإجرامية تسيطر على برمنغهام.",
image:"https://image.tmdb.org/t/p/w500/vUUqzWa2LnHIVqkaKVlVGkVcZIW.jpg",
quality:"4K",
year:"2013",
seasons:[
{
season:1,
episodes:[
{
title:"الحلقة 1",
video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
},
{
title:"الحلقة 2",
video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
}
]
}
]
},

{
id:2,
title:"The Boys",
description:"أبطال خارقون فاسدون ومجموعة تسعى لإيقافهم.",
image:"https://image.tmdb.org/t/p/w500/stTEycfG9928HYGEISBFaG1ngjM.jpg",
quality:"4K",
year:"2019",
seasons:[
{
season:1,
episodes:[
{
title:"الحلقة 1",
video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"
},
{
title:"الحلقة 2",
video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
}
]
}
]
}

];

const grid = document.getElementById("grid");

function render(data){

grid.innerHTML = "";

data.forEach(show=>{

grid.innerHTML += `

<div class="card" onclick="openPlayer(${show.id})">

<img src="${show.image}">

<div class="card-info">

<div class="card-title">
${show.title}
</div>

<div class="card-meta">

<span>${show.year}</span>

<span>${show.quality}</span>

</div>

</div>

</div>

`;

});

}

render(shows);

document.getElementById("searchInput")
.addEventListener("input",(e)=>{

const value = e.target.value.toLowerCase();

const filtered = shows.filter(show =>
show.title.toLowerCase().includes(value)
);

render(filtered);

});

window.addEventListener("scroll",()=>{

const header = document.getElementById("header");

if(window.scrollY > 30){
header.classList.add("active");
}else{
header.classList.remove("active");
}

});

let currentShow = null;

function openPlayer(id){

currentShow = shows.find(s => s.id === id);

document.getElementById("modal").classList.add("active");

document.getElementById("modalTitle").innerText =
currentShow.title;

document.getElementById("modalDesc").innerText =
currentShow.description;

const seasonSelect =
document.getElementById("seasonSelect");

seasonSelect.innerHTML = "";

currentShow.seasons.forEach((s,index)=>{

seasonSelect.innerHTML += `
<option value="${index}">
الموسم ${s.season}
</option>
`;

});

updateEpisodes();

}

function updateEpisodes(){

const seasonIndex =
document.getElementById("seasonSelect").value;

const episodes =
currentShow.seasons[seasonIndex].episodes;

const episodeSelect =
document.getElementById("episodeSelect");

episodeSelect.innerHTML = "";

episodes.forEach((ep,index)=>{

episodeSelect.innerHTML += `
<option value="${index}">
${ep.title}
</option>
`;

});

playEpisode();

}

function playEpisode(){

const seasonIndex =
document.getElementById("seasonSelect").value;

const episodeIndex =
document.getElementById("episodeSelect").value;

const episode =
currentShow.seasons[seasonIndex]
.episodes[episodeIndex];

player.source = {
type:'video',
sources:[
{
src:episode.video,
type:'video/mp4'
}
]
};

player.play();

}

document.getElementById("seasonSelect")
.addEventListener("change",updateEpisodes);

document.getElementById("episodeSelect")
.addEventListener("change",playEpisode);

function closePlayer(){

document.getElementById("modal")
.classList.remove("active");

player.pause();

}

</script>

</body>
</html>
